# Pin the JDK every Gradle build uses on this machine. Homebrew's default
# `java` is 25.0.2, which Gradle 8.x / AGP 8.x don't support yet, so builds
# fail with a bare "25.0.2". org.gradle.java.home wins over PATH, JAVA_HOME
# and the invoker (flutter CLI, flutter-tools.nvim, raw ./gradlew, any IDE).
# macOS/arm Homebrew path; adjust if a machine keeps openjdk@21 elsewhere.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
