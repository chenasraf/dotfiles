.config:
  bin_name: nxc
  flags:
    aio:
      type: bool
      description: Use AIO container instead of dev (or set NXC_AIO=1)
  env:
    # Shared shell helpers, pulled into a command with `eval "$NC_LIB"`.
    # nc_target resolves which instance the AIO-aware commands act on; the nc_aio_*
    # helpers target AIO unconditionally, for commands that only make sense there.
    NC_LIB: |
      nc_target() {
        NC_AIO=0
        [ "$WAND_FLAG_AIO" = "true" ] && NC_AIO=1
        case "$(printf '%s' "${NXC_AIO:-}" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes|y|on) NC_AIO=1 ;;
        esac
        if [ "$NC_AIO" = 1 ]; then
          NC_SUDO=sudo
          NC_CONTAINER=nextcloud-aio-nextcloud
        else
          NC_SUDO=
          NC_VERSION="$(tr -d '\n' < "$HOME/.nc-dev-version" 2>/dev/null)"
          [ -z "$NC_VERSION" ] && NC_VERSION=nextcloud
          NC_CONTAINER="nextcloud-${NC_VERSION}-1"
        fi
      }
      nc_exec() { nc_target; $NC_SUDO docker exec --user www-data "$NC_CONTAINER" "$@"; }
      nc_exec_tty() { nc_target; $NC_SUDO docker exec --user www-data -it "$NC_CONTAINER" "$@"; }
      nc_aio() { sudo docker exec --user www-data nextcloud-aio-nextcloud "$@"; }
      nc_aio_tty() { sudo docker exec --user www-data -it nextcloud-aio-nextcloud "$@"; }

use:
  description: Set the Nextcloud dev version
  cmd: |
    VERSION_FILE="$HOME/.nc-dev-version"
    VERSION="$1"
    if [ -z "$VERSION" ]; then
      VERSION="$(tr -d '\n' < "$VERSION_FILE" 2>/dev/null)"
      [ -z "$VERSION" ] && VERSION="nextcloud"
    else
      if [ "$VERSION" != "master" ] && [ "$VERSION" != "latest" ] && [ "$VERSION" != "dev" ]; then
        VERSION="stable$VERSION"
      else
        VERSION="nextcloud"
      fi
    fi
    echo "$VERSION" > "$VERSION_FILE"
    echo "Set Nextcloud dev version to: $VERSION"

version:
  description: Get the current Nextcloud dev version
  cmd: |
    VERSION="$(tr -d '\n' < "$HOME/.nc-dev-version" 2>/dev/null)"
    [ -z "$VERSION" ] && VERSION="nextcloud"
    echo "$VERSION"

start:
  description: Start the Nextcloud dev container
  working_dir: ~/Dev/nextcloud-docker-dev
  cmd: |
    VERSION_FILE="$HOME/.nc-dev-version"
    VERSION="$1"
    if [ -n "$VERSION" ]; then
      if [ "$VERSION" != "master" ] && [ "$VERSION" != "latest" ] && [ "$VERSION" != "dev" ]; then
        VERSION="stable$VERSION"
      else
        VERSION="nextcloud"
      fi
      echo "$VERSION" > "$VERSION_FILE"
    else
      VERSION="$(tr -d '\n' < "$VERSION_FILE" 2>/dev/null)"
      [ -z "$VERSION" ] && VERSION="nextcloud"
    fi
    echo "Set Nextcloud dev version to: $VERSION"
    docker compose up -d proxy "$VERSION"

    # Expose the instance to other LAN devices (e.g. phone/Flutter app).
    # IP_BIND=0.0.0.0 and PROXY_PORT_HTTPS live in .env; DEFAULT_HOST in the
    # docker-compose.override.yml. Here we keep trusted_domains in sync with the
    # Mac's current LAN IP so it survives DHCP changes / switching networks.
    IFACE="$(route -n get default 2>/dev/null | awk '/interface:/{print $2}')"
    LAN_IP="$(ipconfig getifaddr "$IFACE" 2>/dev/null)"
    [ -z "$LAN_IP" ] && LAN_IP="$(ipconfig getifaddr en0 2>/dev/null)"
    if [ -n "$LAN_IP" ]; then
      CONTAINER="nextcloud-${VERSION}-1"
      for _ in 1 2 3 4 5 6; do
        docker exec --user www-data "$CONTAINER" php occ status >/dev/null 2>&1 && break
        sleep 2
      done
      # Index 5 is our reserved slot for the dynamic dev LAN IP (base setup uses 0-4).
      if docker exec --user www-data "$CONTAINER" \
          php occ config:system:set trusted_domains 5 --value="$LAN_IP" >/dev/null 2>&1; then
        echo "LAN access: http://$LAN_IP  (point the mobile app here)"
      else
        echo "Warning: could not update trusted_domains for $LAN_IP (container not ready?)" >&2
      fi
    else
      echo "Warning: could not detect LAN IP; skipping trusted_domains update" >&2
    fi

stop:
  description: Stop the Nextcloud dev container
  working_dir: ~/Dev/nextcloud-docker-dev
  cmd: docker compose stop

exec:
  description: Execute command in the Nextcloud container
  cmd: |
    eval "$NC_LIB"
    nc_exec_tty "$@"

occ:
  description: Run occ command in Nextcloud container
  cmd: |
    eval "$NC_LIB"
    nc_exec_tty php occ "$@"

logs:
  description: Tail the Nextcloud log file
  flags:
    pretty:
      alias: p
      type: bool
      description: Pretty-print JSON logs with jq
  cmd: |
    eval "$NC_LIB"
    nc_target

    if [ "$WAND_FLAG_PRETTY" = "true" ]; then
      $NC_SUDO docker exec --user www-data "$NC_CONTAINER" tail "$@" /var/www/html/data/nextcloud.log \
        | while IFS= read -r line; do
            printf '%s\n' "$line" | jq -C -c --unbuffered .
            printf '\n'
          done
    else
      $NC_SUDO docker exec --user www-data "$NC_CONTAINER" tail "$@" /var/www/html/data/nextcloud.log
    fi

debug:
  description: Set Nextcloud debug mode
  cmd: |
    eval "$NC_LIB"
    nc_exec_tty php occ config:system:set debug --type bool --value "$1"

upgrade:
  description: Upgrade Nextcloud AIO
  flags:
    beta:
      type: bool
      description: Upgrade via beta channel
  cmd: |
    eval "$NC_LIB"
    if [ "$WAND_FLAG_BETA" = "true" ]; then
      nc_aio_tty php occ config:system:set updater.release.channel --value=beta
      nc_aio_tty php updater/updater.phar --no-interaction
      nc_aio_tty php occ config:system:set updater.release.channel --value=stable
    else
      nc_aio_tty php updater/updater.phar --no-interaction
    fi

force-appupdate:
  description: Force refresh Nextcloud AIO app store cache
  aliases: [fau]
  cmd: |
    eval "$NC_LIB"
    INSTANCE_ID=$(nc_aio_tty php occ config:system:get instanceid | tr -d "\n\r")
    NC_VERSION=$(nc_aio_tty php occ config:system:get version | tr -d "\n\r")
    if [ -z "$NC_VERSION" ]; then
      echo "Failed to detect Nextcloud version" >&2
      exit 1
    fi
    # Platform endpoint expects MAJOR.0.0 (matches Nextcloud's own AppFetcher)
    NC_MAJOR="${NC_VERSION%%.*}"
    PLATFORM_VERSION="${NC_MAJOR}.0.0"
    APPSTORE_DIR="/mnt/ncdata/appdata_${INSTANCE_ID}/appstore"
    APPS_JSON="${APPSTORE_DIR}/apps.json"
    mv "$APPS_JSON" "${APPS_JSON}.bk"
    URL="https://apps.nextcloud.com/api/v1/platform/${PLATFORM_VERSION}/apps.json"
    echo "Downloading appstore apps.json for NC ${NC_VERSION} (platform ${PLATFORM_VERSION})..."
    # Use a cache-busting query string and no-cache header to defeat any
    # intermediate caches; the platform endpoint is dynamic but be safe.
    TMP_JSON=$(mktemp)
    if ! curl -L -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
        "${URL}?_=$(date +%s)" -o "$TMP_JSON"; then
      echo "Failed to download apps.json. Restoring backup."
      rm -f "$TMP_JSON"
      mv "${APPS_JSON}.bk" "$APPS_JSON"
      exit 1
    fi
    # Wrap in NC's AppFetcher format with a far-future timestamp (1 week)
    # so Nextcloud doesn't overwrite it on next page load.
    FUTURE_TS=$(( $(date +%s) + 604800 ))
    jq -n --argjson ts "$FUTURE_TS" --arg ver "$PLATFORM_VERSION" \
      --slurpfile data "$TMP_JSON" \
      '{ timestamp: $ts, data: $data[0], ncversion: $ver }' > "$APPS_JSON"
    rm -f "$TMP_JSON"
    chown www-data:www-data "$APPS_JSON"

latest-version:
  description: Get the latest version of a Nextcloud app from the cached apps.json
  aliases: [lv]
  cmd: |
    NAME="$1"
    if [ -z "$NAME" ]; then
      echo "Usage: nxc latest-version <app_id>"
      exit 1
    fi
    eval "$NC_LIB"
    INSTANCE_ID=$(nc_aio php occ config:system:get instanceid | tr -d "\n\r")
    APPS_JSON="/mnt/ncdata/appdata_${INSTANCE_ID}/appstore/apps.json"
    if ! nc_aio test -f "$APPS_JSON"; then
      echo "apps.json not found at $APPS_JSON. Run 'nxc force-appupdate' first." >&2
      exit 1
    fi
    VERSION=$(nc_aio cat "$APPS_JSON" | jq -r --arg id "$NAME" '
      (if type == "object" and has("data") then .data else . end)
      | .[] | select(.id == $id) | .releases
      | map(select(.isNightly == false) | .version)
      | sort_by(split(".") | map(tonumber? // 0))
      | last // empty
    ')
    if [ -z "$VERSION" ]; then
      echo "No releases found for app: $NAME" >&2
      exit 1
    fi
    echo "$VERSION"

backup:
  description: Rsync Nextcloud data from remote server to external drive
  confirm: This will sync from spider.casraf.dev to the 2T SSD. Continue?
  cmd: |
    DRIVE="/Volumes/2T SSD"
    if [ ! -d "$DRIVE/Nextcloud/" ]; then
      echo "Mount the 2T SSD first!"
      exit 1
    fi

    RSYNC=""
    for c in /opt/homebrew/bin/rsync /usr/local/bin/rsync; do
      [ -x "$c" ] && RSYNC="$c" && break
    done
    if [ -z "$RSYNC" ]; then
      echo "GNU rsync not found - run 'brew install rsync' (or 'sofmani')." >&2
      exit 1
    fi

    "$RSYNC" -rltDvh --delete --delete-excluded --partial \
      --info=progress2 --timeout=600 \
      --exclude 'appdata_*/' \
      --exclude '._*' \
      --exclude '.pnpm-store/' \
      --exclude '*.log' \
      --exclude '*.log.*' \
      spider:/mnt/ncdata/ \
      "$DRIVE/Nextcloud/"
    find "$DRIVE/Nextcloud" -type f -name '._*' -exec rm -f -- {} +

install-app:
  description: Download and install a Nextcloud app from GitHub releases
  cmd: |
    NAME="$1"
    VERSION="$2"
    if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
      echo "Usage: nxc install-app <name> <version>"
      echo "Example: nxc install-app pantry 0.1.1"
      exit 1
    fi
    URL="https://github.com/chenasraf/nextcloud-${NAME}/releases/download/v${VERSION}/${NAME}-v${VERSION}.tar.gz"
    eval "$NC_LIB"
    nc_exec bash -c "curl -L -o /tmp/${NAME}.tar.gz ${URL}"
    nc_exec bash -c "tar xzf /tmp/${NAME}.tar.gz -C /var/www/html/custom_apps/ && rm /tmp/${NAME}.tar.gz"
    nc_exec_tty php occ app:enable "$NAME"

db-proxy:
  description: Manage AIO database proxy
  children:
    start:
      description: Start a local proxy to the Nextcloud AIO database container
      env:
        NC_CFG_PATH: /var/lib/docker/volumes/nextcloud_aio_nextcloud/_data/config/config.php
        NC_DB_CONTAINER: nextcloud-aio-database
        NC_PROXY_NAME: nc-db-proxy
      cmd: |
        DBTYPE="" DBHOST_RAW="" DBUSER="" DBPASS="" DBNAME=""
        while IFS='=' read -r k v; do
          case "$k" in
            dbtype) DBTYPE="$v" ;;
            dbhost) DBHOST_RAW="$v" ;;
            dbuser) DBUSER="$v" ;;
            dbpassword) DBPASS="$v" ;;
            dbname) DBNAME="$v" ;;
          esac
        done <<EOF
        $(sudo awk '/dbtype|dbname|dbuser|dbpassword|dbhost/ { gsub(/[ ,'\'';\t]/,""); gsub(/=>/,"="); print }' "$NC_CFG_PATH")
        EOF

        if [ -z "$DBTYPE" ] || [ -z "$DBHOST_RAW" ] || [ -z "$DBUSER" ] || [ -z "$DBPASS" ] || [ -z "$DBNAME" ]; then
          echo "Failed to read DB settings from $NC_CFG_PATH" >&2
          exit 1
        fi

        case "$DBTYPE" in
          pgsql)    SCHEME="postgres"; DEFAULT_PORT=5432 ;;
          mysql|mariadb) SCHEME="mysql"; DEFAULT_PORT=3306 ;;
          *) echo "Unknown dbtype '$DBTYPE'" >&2; exit 1 ;;
        esac

        INTERNAL_HOST="$DBHOST_RAW"
        case "$DBHOST_RAW" in
          *:*) INTERNAL_HOST="${DBHOST_RAW%%:*}"; DBPORT="${DBHOST_RAW##*:}" ;;
          *)   DBPORT="$DEFAULT_PORT" ;;
        esac

        if [ "$DBPORT" = "5432" ]; then LOCALPORT=55432; else LOCALPORT=53306; fi

        if ! docker inspect "$NC_DB_CONTAINER" >/dev/null 2>&1; then
          echo "Container $NC_DB_CONTAINER not found." >&2
          exit 1
        fi
        NET=$(docker inspect -f '{{range $k, $_ := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$NC_DB_CONTAINER" | head -n1)
        if [ -z "$NET" ]; then
          echo "Could not determine Docker network for $NC_DB_CONTAINER." >&2
          exit 1
        fi

        docker rm -f "$NC_PROXY_NAME" >/dev/null 2>&1 || true
        if ! docker run -d --rm --name "$NC_PROXY_NAME" --network "$NET" \
          -p "127.0.0.1:${LOCALPORT}:${DBPORT}" \
          alpine/socat \
          "tcp-listen:${DBPORT},fork,reuseaddr" "tcp:${INTERNAL_HOST}:${DBPORT}" >/dev/null; then
          echo "Failed to start proxy container." >&2
          exit 1
        fi

        if [ "$SCHEME" = "postgres" ]; then
          URI="postgres://${DBUSER}:${DBPASS}@127.0.0.1:${LOCALPORT}/${DBNAME}?sslmode=disable"
        else
          URI="mysql://${DBUSER}:${DBPASS}@127.0.0.1:${LOCALPORT}/${DBNAME}"
        fi
        echo "Proxy up: 127.0.0.1:${LOCALPORT} -> ${INTERNAL_HOST}:${DBPORT} (network: ${NET})"
        echo "LazySQL connection URI:"
        echo "  ${URI}"
        echo
        echo "When done, run: nxc db-proxy stop"

    stop:
      description: Stop the Nextcloud AIO database proxy
      env:
        NC_PROXY_NAME: nc-db-proxy
      cmd: |
        if docker rm -f "$NC_PROXY_NAME" >/dev/null 2>&1; then
          echo "Proxy stopped."
        else
          echo "No proxy running."
        fi
unlock-files:
  description: Clear dangling file locks
  cmd: |
    sudo docker exec nextcloud-aio-redis sh -c 'redis-cli -a "$REDIS_HOST_PASSWORD" --scan --pattern "*lockfiles*" | xargs redis-cli -a "$REDIS_HOST_PASSWORD" del'
