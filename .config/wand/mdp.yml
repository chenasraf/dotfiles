.config:
  bin_name: mdp
  env:
    # Directories whose contents are never part of the documentation, and which
    # are big enough that walking them would dominate the search for a page to
    # open or the listing of a directory that has no index.
    MDP_PRUNE: .git node_modules vendor dist build target .next .nuxt .venv venv __pycache__ .cache coverage .terraform Pods .dart_tool .svelte-kit

main:
  description: Preview a markdown project in the browser, reloading as you edit
  flags:
    root:
      alias: r
      description: 'Project directory to serve (default: the git root, else the file''s directory)'
    port:
      alias: p
      description: 'Port to listen on (default: whatever the system hands out)'
    host:
      description: 'Address to bind (default: 127.0.0.1 — use 0.0.0.0 to read it from another device)'
    no-open:
      type: bool
      description: Print the URL instead of opening a browser
  cmd: |
    set -uo pipefail

    for _need in pandoc python3; do
      command -v "$_need" >/dev/null 2>&1 || { echo "mdp: $_need is not installed" >&2; exit 1; }
    done

    SERVER="$CFG/wand/_mdp_server.py"
    TEMPLATE="$HOME/.local/share/zsh/plugins/local/assets/mdp-template.html"
    [ -f "$TEMPLATE" ] || { echo "mdp: template missing at $TEMPLATE" >&2; exit 1; }

    abspath() { (cd "$(dirname "$1")" 2>/dev/null && printf '%s/%s' "$(pwd)" "$(basename "$1")"); }

    ENTRY=
    if [ $# -ge 1 ] && [ -n "$1" ]; then
      [ -f "$1" ] || { echo "mdp: no such file: $1" >&2; exit 1; }
      ENTRY="$(abspath "$1")"
    fi

    # The project is what the links have to resolve against: the git checkout if
    # there is one, otherwise where you are standing, and only the file's own
    # directory when that file sits outside it.
    ROOT="$WAND_FLAG_ROOT"
    if [ -n "$ROOT" ]; then
      [ -d "$ROOT" ] || { echo "mdp: no such directory: $ROOT" >&2; exit 1; }
      ROOT="$(cd "$ROOT" && pwd)"
    else
      FROM="$PWD"
      [ -n "$ENTRY" ] && FROM="$(dirname "$ENTRY")"
      ROOT="$(cd "$FROM" && git rev-parse --show-toplevel 2>/dev/null)"
      if [ -z "$ROOT" ]; then
        ROOT="$PWD"
        case "${ENTRY:-$PWD/}" in
          "$PWD"/*) ;;
          *) ROOT="$(cd "$FROM" && pwd)" ;;
        esac
      fi
    fi

    if [ -n "$ENTRY" ]; then
      case "$ENTRY" in
        "$ROOT"/*) ;;
        *) echo "mdp: $ENTRY is outside $ROOT" >&2; exit 1 ;;
      esac
    fi

    set -- --root "$ROOT" --template "$TEMPLATE"
    [ -n "$ENTRY" ] && set -- "$@" --entry "$ENTRY"
    [ -n "$WAND_FLAG_PORT" ] && set -- "$@" --port "$WAND_FLAG_PORT"
    [ -n "$WAND_FLAG_HOST" ] && set -- "$@" --host "$WAND_FLAG_HOST"
    [ "$WAND_FLAG_NO_OPEN" = "true" ] && set -- "$@" --no-open

    exec python3 "$SERVER" "$@"

html:
  description: Convert a markdown file to HTML and write it to stdout
  cmd: |
    FILE="${1:-README.md}"
    if ! command -v pandoc >/dev/null 2>&1; then
      echo "Pandoc not installed. Please install pandoc first." >&2
      exit 1
    fi
    pandoc "$FILE"
