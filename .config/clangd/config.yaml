# clangd's user config. Linux reads it here; macOS only looks in ~/Library/Preferences/clangd,
# which Library/Preferences/clangd in this repo symlinks back to this directory.
# clangd applies this file after a project's .clangd and .clang-tidy, so a project can't turn
# back off a check that this file adds.
CompileFlags:
  # A default case turns off -Wswitch, which warns when an enum switch misses a value. Butano's
  # flags include -Wswitch-default, which asks every switch for one.
  Add: [-Wno-switch-default]
Diagnostics:
  UnusedIncludes: Strict
  MissingIncludes: Strict
  # clangd runs no clang-tidy checks unless told to, and most quick fixes come from them.
  ClangTidy:
    Add:
      - bugprone-*
      - modernize-*
      - performance-*
      - readability-*
    Remove:
      - bugprone-easily-swappable-parameters
      - modernize-avoid-c-arrays
      - modernize-use-designated-initializers
      - modernize-use-nodiscard
      - modernize-use-trailing-return-type
      - readability-function-cognitive-complexity
      - readability-identifier-length
      - readability-magic-numbers
      # Flags `= {}` on a member, which GCC's -Wmissing-field-initializers (-Wextra) needs for
      # a designated initializer to leave the member out.
      - readability-redundant-member-init
      - readability-uppercase-literal-suffix
